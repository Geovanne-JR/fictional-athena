[project]
name = "athena"
version = "3.0.0"
description = "Athena — IA pessoal local do Projeto Olimpo"
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.5",
    "rich>=13",
    "psutil>=5.9",
    "ddgs>=9",
    "trafilatura>=2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
athena = "athena.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["athena"]

[tool.pytest.ini_options]
testpaths = ["tests"]
